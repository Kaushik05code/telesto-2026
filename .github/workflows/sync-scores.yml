name: Sync BMT scores from Google Sheet

on:
  schedule:
    - cron: "*/5 * * * *"      # every 5 minutes (GitHub's minimum)
  workflow_dispatch: {}         # manual "sync now" button in the Actions tab

concurrency:
  group: sync-scores
  cancel-in-progress: false

permissions:
  contents: write               # only what the commit needs — nothing else

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      # Cron can't run more often than every 5 min, so each run syncs
      # once a minute for the whole window — net cadence: ~1/minute.
      - name: Sync loop (every ~55s for the 5-minute window)
        env:
          GCP_SA_KEY: ${{ secrets.GCP_SA_KEY }}
        run: |
          git config user.name "telesto-scorebot"
          git config user.email "actions@github.com"
          for i in 1 2 3 4 5 6; do
            echo "--- sync pass $i ---"
            node scripts/sync-scores.mjs
            if ! git diff --quiet data/scores.json; then
              git add data/scores.json
              git commit -m "scores: sync from BMT sheet"
              git pull --rebase origin main
              git push
              echo "pushed new standings"
            else
              echo "standings unchanged"
            fi
            if [ "$i" -lt 6 ]; then sleep 55; fi
          done
          echo "sync loop complete"
