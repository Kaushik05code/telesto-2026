name: Sync BMT scores from Google Sheet

on:
  schedule:
    - cron: "*/5 * * * *"      # every 5 minutes (GitHub's minimum)
  workflow_dispatch: {}         # manual "sync now" button in the Actions tab

# One long-running sync at a time; each cron tick keeps exactly one
# follow-up queued, so when the active run ends the next starts at once.
# Net effect: continuous ~1/minute sync, immune to cron jitter.
concurrency:
  group: sync-scores
  cancel-in-progress: false

permissions:
  contents: write               # only what the commit needs — nothing else

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 70
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Sync loop (~55 min, one pass per minute)
        env:
          GCP_SA_KEY: ${{ secrets.GCP_SA_KEY }}
        run: |
          git config user.name "telesto-scorebot"
          git config user.email "actions@github.com"
          for i in $(seq 1 60); do
            echo "--- sync pass $i ---"
            node scripts/sync-scores.mjs
            if ! git diff --quiet data/scores.json; then
              git add data/scores.json
              git commit -m "scores: sync from BMT sheet"
              git pull --rebase origin main
              git push
              echo "pushed new standings"
            else
              echo "standings unchanged"
            fi
            if [ "$i" -lt 60 ]; then sleep 55; fi
          done
          echo "sync loop complete"
